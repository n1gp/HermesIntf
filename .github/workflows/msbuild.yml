# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ published ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Locate built DLL
      id: finddll
      shell: pwsh
      run: |
        $dll = Get-ChildItem -Path . -Recurse -Filter HermesIntf.dll |
          Where-Object { $_.FullName -match 'Release' } |
          Select-Object -First 1
        if (-not $dll) { throw "HermesIntf.dll not found after build" }
        "path=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        Write-Host "Found DLL: $($dll.FullName)"

    - name: Upload DLL artifact
      uses: actions/upload-artifact@v4
      with:
        name: HermesIntf-dll
        path: ${{ steps.finddll.outputs.path }}
        if-no-files-found: error

    - name: Attach DLL to release
      if: github.event_name == 'release'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload ${{ github.event.release.tag_name }} "${{ steps.finddll.outputs.path }}" --clobber
